version: '3.8'

services:
  # Serviço do Backend (Flask)
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    env_file:  
      - ./.env

  # Serviço do Frontend (React)
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_APP_API_URL=/api
    depends_on:
      - backend  

  # Serviço do Banco de Dados (MySQL)
  db:
  image: mysql:8.0
  env_file:
    - ./.env  # ← Seguro, pois .env não vai para o git
  ports:
    - "3307:3306"
  volumes:
    - db_data:/var/lib/mysql

volumes:
  db_data: