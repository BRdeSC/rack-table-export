server {
    listen 80;

    server_name _;

    # Raiz do site
    root /usr/share/nginx/html;

    # Para assets estáticos do React
    location /rack {
        index index.html;
        try_files $uri /rack/index.html;
    }

    # opcional: se quiser que / também redirecione para /rack
    location = / {
        return 302 /rack;
    }
}
